[project]
name = "ragflow-kb-mcp"
version = "0.2.0"
description = "MCP server for the RAGFlow HTTP API: datasets, documents, parsing, chunks, retrieval, chats, agents, memories, files and search apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tomas Fecko" }]
keywords = ["mcp", "ragflow", "rag", "knowledge-base"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.20,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/feci/ragflow-mcp-server"

[project.scripts]
ragflow-kb-mcp = "ragflow_kb_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragflow_kb_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
